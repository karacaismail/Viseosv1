# Prometheus Configuration for VISE OS
# Enterprise-grade monitoring for visa appointment booking automation platform
# Supports 200 parallel sessions, 1000 daily appointments

global:
  # How frequently to scrape targets
  scrape_interval: 15s
  # How frequently to evaluate alerting rules
  evaluation_interval: 15s
  # External labels for federation and remote storage
  external_labels:
    cluster: 'vise-os'
    environment: 'production'

# Alertmanager configuration for alert routing
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      scheme: http
      timeout: 10s
      api_version: v2

# Rule files for alerting and recording rules
rule_files:
  - /etc/prometheus/rules/*.yml

# Scrape configurations
scrape_configs:
  # =============================================================================
  # VISE OS API SERVER
  # =============================================================================
  - job_name: 'vise-api'
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000
        labels:
          service: 'api'
          component: 'application'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):\d+'
        replacement: '${1}'

  # =============================================================================
  # CELERY WORKERS
  # =============================================================================
  - job_name: 'vise-workers'
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker-generic:9100
          - worker-vfs:9100
          - worker-idata:9100
          - worker-bls:9100
        labels:
          service: 'worker'
          component: 'celery'
    relabel_configs:
      - source_labels: [__address__]
        target_label: worker_type
        regex: 'worker-([^:]+):\d+'
        replacement: '${1}'

  # =============================================================================
  # REDIS
  # =============================================================================
  - job_name: 'redis'
    static_configs:
      - targets:
          - redis:6379
        labels:
          service: 'redis'
          component: 'cache'

  # =============================================================================
  # POSTGRESQL (via Directus)
  # =============================================================================
  - job_name: 'postgres'
    static_configs:
      - targets:
          - postgres:5432
        labels:
          service: 'postgres'
          component: 'database'

  # =============================================================================
  # DIRECTUS CMS
  # =============================================================================
  - job_name: 'directus'
    metrics_path: /server/health
    static_configs:
      - targets:
          - directus:8055
        labels:
          service: 'directus'
          component: 'cms'

  # =============================================================================
  # PROMETHEUS SELF-MONITORING
  # =============================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - localhost:9090
        labels:
          service: 'prometheus'
          component: 'monitoring'

  # =============================================================================
  # NODE EXPORTER (Host Metrics)
  # =============================================================================
  - job_name: 'node'
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: 'node-exporter'
          component: 'infrastructure'

# Storage configuration
storage:
  tsdb:
    # Retention period for time series data
    retention_time: 15d
    # Out-of-order time window for ingesting samples
    out_of_order_time_window: 30m

